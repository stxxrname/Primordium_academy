
<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TRPG WORLD</title>

    <style>
        /* 기본 설정 */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f8f9fc;
            color: #25283a;
        }

        /* 상단 메뉴 */
        header {
            width: 100%;
            height: 80px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10%;
            background: rgba(255,255,255,0.85);
            border-bottom: 1px solid #eeeeF4;
        }

        .logo {
            font-size: 25px;
            font-weight: bold;
            color: #6657d9;
        }

        nav {
            display: flex;
            gap: 30px;
        }

        nav a {
            text-decoration: none;
            color: #55596c;
            font-size: 15px;
            transition: 0.2s;
        }

        nav a:hover {
            color: #6657d9;
        }

        /* 메인 배경 */
        .hero {
            min-height: 650px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 60px 20px;

            background:
                radial-gradient(
                    circle at 20% 30%,
                    #e9e5ff 0%,
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 70%,
                    #e2edff 0%,
                    transparent 35%
                ),
                #f8f9fc;
        }

        /* 작은 안내 문구 */
        .tag {
            background: #eeebff;
            color: #6657d9;
            padding: 9px 18px;
            border-radius: 30px;
            font-size: 13px;
            margin-bottom: 25px;
        }

        /* 메인 제목 */
        .hero h1 {
            font-size: 55px;
            line-height: 1.3;
            margin-bottom: 20px;
            letter-spacing: -2px;
        }

        .hero h1 span {
            color: #7061e8;
        }

        .hero p {
            font-size: 17px;
            color: #85899b;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        /* 버튼 영역 */
        .buttons {
            display: flex;
            gap: 15px;
        }

        .btn {
            padding: 16px 30px;
            border-radius: 12px;
            font-size: 15px;
            font-weight: bold;
            text-decoration: none;
            cursor: pointer;
            transition: 0.25s;
            border: none;
        }

        /* 메인 버튼 */
        .btn-primary {
            background: #7061e8;
            color: white;
            box-shadow: 0 5px 15px #7061e833;
        }

        .btn-primary:hover {
            background: #5949cf;
            transform: translateY(-3px);
        }

        /* 보조 버튼 */
        .btn-secondary {
            background: white;
            color: #55596c;
            border: 1px solid #e3e4ec;
        }

        .btn-secondary:hover {
            background: #f0eeff;
            border-color: #7061e8;
            transform: translateY(-3px);
        }

        /* 아래 소개 영역 */
        .intro {
            text-align: center;
            padding: 80px 20px;
        }

        .intro h2 {
            font-size: 28px;
            margin-bottom: 15px;
        }

        .intro p {
            color: #85899b;
            line-height: 1.8;
        }

        /* 모바일 화면 */
        @media (max-width: 650px) {
            header {
                padding: 0 5%;
            }

            nav {
                gap: 12px;
            }

            nav a {
                font-size: 12px;
            }

            .logo {
                font-size: 19px;
            }

            .hero h1 {
                font-size: 36px;
            }

            .hero p {
                font-size: 14px;
            }

            .buttons {
                flex-direction: column;
                width: 80%;
            }
        }
    </style>
</head>

<body>

    <!-- 상단 메뉴 -->
    <header>
        <div class="logo">TRPG WORLD</div>

        <nav>
            <a href="#">홈</a>
            <a href="#intro">소개</a>
            <a href="#">세션 목록</a>
            <a href="#">가이드</a>
        </nav>
    </header>

    <!-- 메인 화면 -->
    <main>
        <section class="hero">

            <div class="tag">
                ✦ YOUR OWN FANTASY WORLD
            </div>

            <h1>
                당신만의 이야기를<br>
                <span>시작해 보세요.</span>
            </h1>

            <p>
                친구들과 함께 모험을 떠나고<br>
                새로운 세계와 이야기를 만들어 보세요.
            </p>

            <div class="buttons">
                <button class="btn btn-primary"
                    onclick="alert('세션 만들기는 준비 중입니다!')">
                    세션 만들기 →
                </button>

                <button class="btn btn-secondary"
                    onclick="alert('세션 목록은 준비 중입니다!')">
                    세션 둘러보기
                </button>
            </div>

        </section>

        <!-- 소개 영역 -->
        <section class="intro" id="intro">
            <h2>모험은 여기서 시작됩니다.</h2>

            <p>
                나만의 캐릭터를 만들고<br>
                친구들과 함께 특별한 이야기를 만들어 보세요.
            </p>
        </section>
    </main>

</body>
</html>
